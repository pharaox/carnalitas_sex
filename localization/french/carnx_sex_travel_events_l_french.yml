l_french:
 carnx_sex_travel.0001.t: "$travel_completion_event.1000.t$"
 carnx_sex_travel.0001.desc.start_valid: "Après un long voyage, je suis enfin arrivé à [current_location.GetName]. Je peux maintenant $carnx_sex_travel_interaction$ m[recipient.Custom('FR_OnA')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName] et m’occuper d’autres affaires tant que je suis ici."
 carnx_sex_travel.0001.desc.start_invalid: "À mon arrivée à [current_location.GetName], je constate que je ne peux plus $carnx_sex_travel_interaction$ m[recipient.Custom('FR_OnA')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] [recipient.GetTitledFirstName]. Je peux entamer immédiatement le voyage de retour, ou prendre un moment pour regarder autour de moi avant de partir."
 carnx_sex_travel.0001.a: "Passer à l’action, puis rentrer"
 carnx_sex_travel.0001.b: "Rentrer"
 carnx_sex_travel.0001.c: "Rester ici et regarder autour de moi"

 carnx_sex_travel_interaction: "[SelectLocalization(EqualTo_string(SCOPE.GetFlagName('interaction'), 'sex'), 'carn_sex_interaction', 'dsi_demand_sex_interaction')] [Select_CString(EqualTo_string(SCOPE.GetFlagName('interaction'), 'sex'), 'à', 'de')]"

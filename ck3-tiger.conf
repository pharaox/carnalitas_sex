# The ck3-tiger.conf file is in standard Paradox script format.
# It should be placed in the top directory of your mod.

languages = {
	# This will check only english and german localizations
	#check = "english"
	#check = "german"

	# If you DON'T specify any check languages, you can instead say which ones to skip.
	#skip = "french"
	#skip = "spanish"

	# If you don't specify anything in languages, the validator will check all languages.
}

# Allows configuring what reports are printed by CK3-Tiger.
filter = {

    # Whether to report about problems in vanilla game files.
    # Setting this to 'yes' results in a LOT of spam.
    # Optional boolean value, defaults to no.
    show_vanilla = no

    # Whether to report about problems in mods loaded via the load_mod sections.
    # Optional boolean value, defaults to no.
    show_loaded_mods = no

    # Contains rules for reports, using trigger syntax.
    # Only reports matching the trigger will be printed.
    # The root trigger is an AND block, just like any other trigger.
    trigger = {
        # For more information, there is a guide at: ck3-tiger/filter.md

        # In short, valid trigger keys are:
        # - always = yes/no
        # - NOT, AND, OR, NAND, NOR
        # - severity
        # - confidence
        # - key
        # - file
        # - text
        # - ignore_keys_in_files

 		# Only print warnings and errors
		severity >= Warning
		# Don't print reports that are likely false positives
		confidence >= Reasonable

		# False positives due to tiger not updated to 1.20.x
		NAND = { # New triggers, effects, and event targets
			key = unknown-field
			OR = {
				text = "unknown token `add_known_doctrine`"
				text = "unknown token `add_rite_doctrine`"
				text = "unknown token `any_holy_site_barony`"
				text = "unknown token `change_spiritual_fulfillment`"
				text = "unknown token `clear_puppet_status`"
				text = "unknown token `clerical_elector_title`"
				text = "unknown token `every_faith_rite`"
				text = "unknown token `government_has_mechanic`"
				text = "unknown token `has_clerical_region`"
				text = "unknown token `has_personal_tenet_flag`"
				text = "unknown token `has_puppet_type`"
				text = "unknown token `is_holy_relic`"
				text = "unknown token `is_puppet_of_type`"
				text = "unknown token `knows_doctrine`"
				text = "unknown token `main_rite`"
				text = "unknown token `puppeteer`"
				text = "unknown token `random_holy_site_barony`"
				text = "unknown token `remove_rite_doctrine`"
				text = "unknown token `rite`"
				text = "unknown token `rite_has_doctrine`"
				text = "unknown token `rite_has_parameter`"
				text = "unknown token `set_character_rite`"
				text = "unknown token `set_puppet`"
				text = "unknown token `state_rite`"
				text = "unknown token `stress_and_fulfillment_impact`"
			}
		}
		NAND = { # New gui datafunctions
			key = datafunctions
			OR = {
				text = "unknown datafunction GetChallenger"
				text = "unknown datafunction GetOrganization"
				text = "unknown datafunction GetPlayerSuccessionResultTypeIcon"
				text = "unknown datafunction GetReligiousSubordinates"
				text = "unknown datafunction GetReligiousSuperior"
				text = "unknown datafunction GetRite"
				text = "unknown datafunction GetSuccessionResultTypeIcon"
				text = "unknown datafunction HasCustomFallbackSuccession"
				text = "unknown datafunction HasMechanic"
				text = "unknown datafunction IsClergy"
				text = "unknown datafunction Organization"
				text = "unknown datafunction Rite"
			}
		}
		NAND = { # New rite: and puppet: prefixes
			key = validation
			OR = {
				text = "unknown prefix `rite`"
				text = "unknown prefix `puppet`"
			}
		}
		NAND = { # Scopes saved inside or after rite triggers and links, which tiger doesn't know yet
			key = strict-scopes
			OR = {
				text = "expects scope:check_rite to be set"
				text = "expects scope:check_rite_liege to be set"
				text = "expects scope:my_rite to be set"
				text = "expects scope:passive_learn_tenet to be set"
			}
		}
		NAND = { # scope:puppet_or_actor is always set in character interactions
			key = strict-scopes
			text = "expects scope:puppet_or_actor to be set"
			file = common/character_interactions/
		}
		NAND = { # on_faith_created has faith root instead of character
			key = scopes
			text = "is for faith but scope seems to be character"
			file = common/on_action/
		}
		NAND = { # New puppets scheme agent group
			key = choice
			text = "expected one of known_secrets, scheme_targets"
			file = common/schemes/scheme_types/
		}
		NAND = { # Faiths moved to common/religion/faith_types/
			key = missing-item
			text = " not defined in common/religion/religions/"
		}
		NAND = { # Doctrine and tenet parameters are now lists in common/religion/doctrine_types/ and common/religion/tenet_types/
			key = missing-item
			text = " not defined in common/religion/doctrine_types/"
		}
		NAND = { # Doctrine parameters are now lists
			key = structure
			text = "expected only `key =`"
			file = common/religion/doctrine_types/
		}
		NAND = { # Situation participant group parameters in the new pam_christian_situation
			key = missing-item
			text = "situation participant group parameter the_christian_church_"
		}
		NAND = { # Laws are now top-level objects, with law groups moved to common/law_groups/
			key = missing-item
			text = " not defined in common/laws/"
		}
		NAND = { # Laws are now top-level objects, tiger reads their fields as laws
			OR = {
				key = duplicate-item
				key = exact-duplicate-item
			}
			text = "law is redefined by "
			file = common/laws/
		}
		NAND = { # Laws are now top-level objects, tiger reads their fields as laws
			key = missing-localization
			OR = {
				text = "localization key can_pass"
				text = "localization key can_keep"
				text = "localization key pass_cost"
				text = "localization key on_pass"
				text = "localization key modifier"
				text = "localization key ai_will_do"
			}
			file = common/laws/
		}

		# Ignored
		NAND = { # Ignore deprecated warnings
			key = deprecated
			text = "should use `is_available` instead of `ai_potential`"
		}

		# Ignored (Carnalitas)
		NAND = { # Missing Carnalitas trait flags
			key = missing-item
			text = "trait flag carn_block_send_sex_interaction not defined in common/traits/"
		}
		NAND = { # Missing Carnalitas localization keys
			key = missing-localization
			OR = {
				text = "missing spanish, french, german and russian localization key carn_had_sex_with_effect.second_person.tt"
				text = "missing spanish, german and russian localization key trait_track_lifestyle_prostitute"
			}
		}

		# Ignored (CLR)
		NAND = { # Missing CBO tokens (intentional)
			key = unknown-field
			text = "unknown token `carnal_court_enter_court_effect`"
		}
		NAND = { # Missing CBO game rules (intentional)
			key = missing-item
			text = "game rule setting carnal_court_make_love_disabled not defined in common/game_rules/"
		}
		NAND = { # Missing CBO localization keys (intentional)
			key = missing-localization
			text = "missing english, spanish, french, german, russian, korean and simp_chinese localization key carnal_court_sex_interaction"
		}
		NAND = { # Issues in Korean translation
			key = missing-item
			text = "not defined in common/game_concepts/"
			file = localization/korean/carnx_sex_scene_quotes_l_korean.yml
		}
	}
}

# Use a load_mod section to tell ck3-tiger to load another mod before this one.
# This is useful when making submods or compatibility patch mods.
# You can have multiple load_mod sections.
load_mod = {
	# The label will be used in the error output to mark files from this mod
	label = "carnalitas"
	# The path to the mod's .mod file. Use forward slashes.
	modfile = "../carnalitas/descriptor.mod"
}

#characters = {
